<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Protein-Gym: Lehrkräfte</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #0b1517; --panel: #12262a; --ink: #f3f1e7; --muted: #a9bcbc; --accent: #f08a24; --ok: #9be3b0; --bad: #ff9c92; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { color: var(--accent); margin: 0 0 4px; }
    p.hint, .hint { color: var(--muted); margin: 4px 0 12px; }
    textarea { width: 100%; min-height: 150px; padding: 10px 12px; border-radius: 10px; border: 2px solid #35656b; background: #0d1d20; color: inherit; font: 16px ui-monospace, "Courier New", monospace; }
    button { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 2px solid #35656b; background: #1a3a40; color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: #ffb866; color: #1d1305; font-weight: 700; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .kopf { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .kopf button { margin-left: auto; }
    .karten { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
    .karte { background: var(--panel); border: 2px solid #35656b; border-radius: 12px; padding: 8px 12px; }
    .karte strong { display: block; font-size: 26px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #25444a; text-align: left; font-size: 16px; }
    th { background: #1a3a40; }
    .ja { color: var(--ok); font-weight: 700; }
    .nein { color: var(--muted); }
    .fehler { color: var(--bad); }
    .scroll { overflow-x: auto; }
    section.codes, section.tor { background: var(--panel); border: 2px solid #35656b; border-radius: 14px; padding: 12px 16px 14px; margin: 14px 0 22px; }
    section.codes h2, section.tor h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
    input.text, select { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 2px solid #35656b; background: #0d1d20; color: inherit; font: inherit; }
    input.text { min-width: 16em; }
    .codes-gross { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0 4px; }
    .code-karte { background: #0d1d20; border: 2px solid #35656b; border-radius: 12px; padding: 10px 14px; text-align: center; }
    .code-karte span { color: var(--muted); }
    .code-karte strong { display: block; font: 800 54px/1.15 ui-monospace, "Courier New", monospace; letter-spacing: 0.08em; color: #ffd24a; }
    .code-karte strong.erz-code { font-size: clamp(22px, 4.2vw, 40px); letter-spacing: 0.04em; word-break: break-all; }
    .balken { height: 10px; border-radius: 6px; background: #0d1d20; border: 1px solid #35656b; overflow: hidden; margin: 8px 0 2px; }
    .balken > div { height: 100%; background: var(--accent); width: 100%; transition: width 0.9s linear; }
    details.neu { margin-top: 12px; }
    details.neu summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--muted); }
    pre.zeile { white-space: pre-wrap; word-break: break-all; background: #0d1d20; border: 2px solid #35656b; border-radius: 10px; padding: 10px 12px; font: 14px ui-monospace, "Courier New", monospace; }
    .erz-raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; margin: 10px 0; }
    .erz-feld { display: grid; gap: 4px; color: var(--muted); }
    .erz-feld select { color: var(--ink); width: 100%; }
    .erz-feld[hidden] { display: none; }
    .erz-breit { grid-column: 1 / -1; }
    .erz-hinweise { padding-left: 1.2em; margin: 10px 0 0; }
    .erz-hinweise li { margin: 4px 0; }
  </style>
</head>

  </script>
  <script type="module">
    import { entschluesseln, entschluesselnMitSchluessel } from './src/state/tresor.js';
    const $ = (s) => document.querySelector(s);
    const MERKEN = 'protein-gym:lehrkraft-tor';
    const roh = $('#paket').textContent.replace(/<!--[\s\S]*?-->/g, '');
    const paket = JSON.parse(roh);

    /** Entschlüsselten Inhalt einsetzen; Skripte darin laufen als Module (relative Importe wie bisher). */
    function oeffne(text, wort) {
      window.__lehrkraft = { wort };
      const tpl = document.createElement('template');
      tpl.innerHTML = text;
      const skripte = [...tpl.content.querySelectorAll('script')];
      skripte.forEach((s) => s.remove());
      $('#inhalt').replaceChildren(tpl.content);
      for (const alt of skripte) {
        const neu = document.createElement('script');
        neu.type = 'module';
        neu.textContent = alt.textContent;
        document.body.append(neu);
      }
      $('#tor').hidden = true;
      $('#tor-ab').hidden = false;
    }

    $('#tor-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = $('#tor-meldung');
      m.className = 'hint'; m.textContent = 'Prüfe …';
      const wort = $('#tor-wort').value;
      const r = paket.daten ? await entschluesseln(paket, wort) : null;
      if (!r) { m.className = 'fehler'; m.textContent = 'Das Passwort stimmt nicht.'; return; }
      $('#tor-wort').value = '';
      m.textContent = '';
      if ($('#tor-merken').checked) { try { localStorage.setItem(MERKEN, JSON.stringify({ salz: paket.salz, schluessel: r.schluessel })); } catch { /* ohne Speicher */ } }
      oeffne(r.text, wort);
    });
    $('#tor-ab').addEventListener('click', () => {
      try { localStorage.removeItem(MERKEN); } catch { /* egal */ }
      location.reload();
    });
    // Angemeldet geblieben: nur der abgeleitete Schlüssel liegt auf dem Gerät, nie das Passwort
    (async () => {
      try {
        const g = JSON.parse(localStorage.getItem(MERKEN) || 'null');
        if (!g || g.salz !== paket.salz) return;
        const text = await entschluesselnMitSchluessel(paket, g.schluessel);
        if (text !== null) oeffne(text, '');
      } catch { /* dann per Passwort */ }
    })();
  </script>
